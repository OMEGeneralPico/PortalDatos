{% extends "base.html" %}

{% block title %}Subir Movimientos de Gastos (CSV){% endblock %}

{% block content %}
<h2>Subir archivo CSV de Movimientos de Gastos</h2>
<p>Este formulario cargará únicamente los registros del año actual en la base de datos MoviGast.</p>
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <input type="file" name="csv_file_movigast" accept=".csv" required />
    <button type="submit">Subir CSV</button>
</form>
{% endblock %}
