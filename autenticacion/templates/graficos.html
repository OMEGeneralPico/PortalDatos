{% extends "base.html" %}

{% block title %}Gráficos{% endblock %}

{% block content %}

    <h4 class="center-align">Gráficos de Presupuesto por Tipo</h4>

    <div class="row" style="display: flex; flex-wrap: wrap;">
        <!-- Gráfico apilado horizontal (nuevo) -->
        <div class="col s12 m12" style="min-height: 500px;">
            <div id="grafico-apilado-horizontal"></div>
        </div>
    </div>

    
    <div class="row" style="display: flex; flex-wrap: wrap;">
        <!-- Gráfico 1: Agrupado por "Tipo" -->
        <div class="col s12 m6" style="min-height: 500px;">
            <div id="grafico-tipo"></div>
        </div>

        <!-- Tabla 1: Agrupado por "Tipo" -->
        <div class="col s12 m6">
            <table class="striped highlight centered responsive-table">
                <thead>
                    <tr class="blue lighten-4">
                        <th>Tipo</th>
                        <th>Compromiso</th>
                        <th>Disponible</th>
                        <th>Presupuesto</th>
                    </tr>
                </thead>
                <tbody id="tabla-datos-tipo"></tbody>
            </table>
        </div>
    </div>
    <h4 class="center-align">Gráficos de Presupuesto por Secretaría</h4>

    <div class="row" style="display: flex; flex-wrap: wrap;">
        <div class="col s12 m12" style="min-height: 500px;">
            <div id="grafico-apilado-secretaria"></div>
        </div>
    </div>
   
    <div class="row" style="display: flex; flex-wrap: wrap;">
        <!-- Gráfico 2: Agrupado por "Secretaría" -->
        <div class="col s12 m6" style="min-height: 500px;">
            <div id="grafico-secretaria"></div>
        </div>

        <!-- Tabla 2: Agrupado por "Secretaría" -->
        <div class="col s12 m6">
            <table class="striped highlight centered responsive-table">
                <thead>
                    <tr class="blue lighten-4">
                        <th>Secretaría</th>
                        <th>Compromiso</th>
                        <th>Disponible</th>
                        <th>Presupuesto</th>
                    </tr>
                </thead>
                <tbody id="tabla-datos-secretaria"></tbody>
            </table>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<script>
    
    document.addEventListener("DOMContentLoaded", function () {
        fetch("{% url 'api_grafico' %}")
            .then(response => response.json())
            .then(data => {
                // === Gráfico apilado horizontal por Secretaría ===
var optionsApiladoSecretaria = {
    chart: {
        type: 'bar',
        height: 600, // Mantiene la misma altura que el otro gráfico
        stacked: true,
        horizontal: true
    },
    plotOptions: {
        bar: {
            barHeight: "60%", // Hace las barras más gruesas
            dataLabels: {
                total: {
                    enabled: true,
                    style: {
                        fontSize: '13px',
                        fontWeight: 600
                    }
                }
            }
        }
    },
    xaxis: {
        categories: data.secretarias // Cambia categorías a "secretarias"
    },
    series: data.seriesSecretaria, // Usa los datos de secretarías
    dataLabels: {
        enabled: true,
        formatter: function (val) {
            return "$" + parseFloat(val).toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
    },
    tooltip: {
        y: {
            formatter: function (val) {
                return "$" + parseFloat(val).toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }
        }
    },
    legend: {
        position: 'top'
    }
};

// Renderizar el nuevo gráfico
var chartApiladoSecretaria = new ApexCharts(document.querySelector("#grafico-apilado-secretaria"), optionsApiladoSecretaria);
chartApiladoSecretaria.render();

                // === Gráfico apilado horizontal (nuevo) ===
                var optionsApiladoHorizontal = {
                    chart: {
                        type: 'bar',
                        height: 600, // Aumentamos la altura del gráfico
                        stacked: true,
                        horizontal: true
                    },
                    plotOptions: {
                        bar: {
                            barHeight: "60%", // Aumentamos el grosor de las barras
                            dataLabels: {
                                total: {
                                    enabled: true,
                                    style: {
                                        fontSize: '13px',
                                        fontWeight: 600
                                    }
                                }
                            }
                        }
                    },
                    xaxis: {
                        categories: data.categorias
                    },
                    series: data.series,
                    dataLabels: {
                        enabled: true,
                        formatter: function (val) {
                            return "$" + parseFloat(val).toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                        }
                    },
                    tooltip: {
                        y: {
                            formatter: function (val) {
                                return "$" + parseFloat(val).toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                            }
                        }
                    },
                    legend: {
                        position: 'top'
                    }
                };
                
                var chartApiladoHorizontal = new ApexCharts(document.querySelector("#grafico-apilado-horizontal"), optionsApiladoHorizontal);
                chartApiladoHorizontal.render();
                

                // === Generar el gráfico por "Tipo" ===
                var optionsTipo = {
                    chart: {
                        type: 'bar',
                        height: 500,
                        stacked: true,
                        stackType: '100%'
                    },
                    plotOptions: {
                        bar: {
                            horizontal: true,
                            columnWidth: "50%",
                            dataLabels: {
                                total: {
                                    enabled: true,
                                    style: {
                                        fontSize: '13px',
                                        fontWeight: 600
                                    }
                                }
                            }
                        }
                    },
                    xaxis: {
                        categories: data.categorias
                    },
                    series: data.series,
                    dataLabels: {
                        enabled: true,
                        formatter: function (val) {
                            return val.toFixed(2) + "%";
                        }
                    },
                    tooltip: {
                        y: {
                            formatter: function (val) {
                                return "$" + val.toLocaleString();
                            }
                        }
                    },
                    legend: {
                        position: 'top'
                    }
                };

                var chartTipo = new ApexCharts(document.querySelector("#grafico-tipo"), optionsTipo);
                chartTipo.render();

                // === Generar la tabla por "Tipo" ===
                let tablaTipo = document.getElementById("tabla-datos-tipo");

                for (let i = 0; i < data.categorias.length; i++) {
                    let tipo = data.categorias[i];
                    let compromiso = data.series[0].data[i];
                    let disponible = data.series[1].data[i];
                    let presupuesto = compromiso + disponible;

                    let fila = `<tr>
                                    <td>${tipo}</td>
                                    <td>$${compromiso.toLocaleString()}</td>
                                    <td>$${disponible.toLocaleString()}</td>
                                    <td><strong>$${presupuesto.toLocaleString()}</strong></td>
                                </tr>`;

                    tablaTipo.innerHTML += fila;
                }

                // === Generar el gráfico por "Secretaría" ===
                var optionsSecretaria = {
                    chart: {
                        type: 'bar',
                        height: 500,
                        stacked: true,
                        stackType: '100%'
                    },
                    plotOptions: {
                        bar: {
                            horizontal: true,
                            columnWidth: "50%",
                            dataLabels: {
                                total: {
                                    enabled: true,
                                    style: {
                                        fontSize: '13px',
                                        fontWeight: 600
                                    }
                                }
                            }
                        }
                    },
                    xaxis: {
                        categories: data.secretarias
                    },
                    series: data.seriesSecretaria,
                    dataLabels: {
                        enabled: true,
                        formatter: function (val) {
                            return val.toFixed(2) + "%";
                        }
                    },
                    tooltip: {
                        y: {
                            formatter: function (val) {
                                return "$" + val.toLocaleString();
                            }
                        }
                    },
                    legend: {
                        position: 'top'
                    }
                };

                var chartSecretaria = new ApexCharts(document.querySelector("#grafico-secretaria"), optionsSecretaria);
                chartSecretaria.render();

                // === Generar la tabla por "Secretaría" ===
                let tablaSecretaria = document.getElementById("tabla-datos-secretaria");

                for (let i = 0; i < data.secretarias.length; i++) {
                    let secretaria = data.secretarias[i];
                    let compromiso = data.seriesSecretaria[0].data[i];
                    let disponible = data.seriesSecretaria[1].data[i];
                    let presupuesto = compromiso + disponible;

                    let fila = `<tr>
                                    <td>${secretaria}</td>
                                    <td>$${compromiso.toLocaleString()}</td>
                                    <td>$${disponible.toLocaleString()}</td>
                                    <td><strong>$${presupuesto.toLocaleString()}</strong></td>
                                </tr>`;

                    tablaSecretaria.innerHTML += fila;
                }
            });
    });
</script>
{% endblock %}
