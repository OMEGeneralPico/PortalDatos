{% extends "base.html" %}

{% block title %}Subir CSV{% endblock %}

{% block content %}
    <h2>Subir archivo CSV</h2>
    
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="file" name="csv_file" />
        <button type="submit">Subir archivo</button>
    </form>
    
{% endblock %}
